spring.application.name=RentService
spring.data.mongodb.uri=mongodb://root:passwd@localhost:27017/rent_db?authSource=admin&serverSelectionTimeoutMS=10000
spring.data.mongodb.database=rent_db
spring.main.lazy-initialization=true
pas.mongodb.collection.clients=clients
pas.mongodb.collection.resources=resources
pas.mongodb.collection.allocations=allocations
jwt.public-key=${JWT_PUBLIC_KEY:classpath:keys/public_key.pem}
server.port=8082

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mongo.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.default-requeue-rejected=false
